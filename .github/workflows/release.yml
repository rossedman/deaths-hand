name: release

# On a v* tag: build the patch.Init firmware and the VCV Rack plugin for Linux x64,
# Windows x64, macOS x64 and macOS arm64, sign every asset keylessly with cosign,
# attest build provenance, and publish a GitHub release. The tag must match the
# version in vcv/plugin.json (VCV requires it to start with 2.).
#
# Pull requests that touch the build run every build job, so a broken platform
# shows up before a tag does; only a tag signs and publishes.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/fetch-rack-sdk.sh"
      - "vcv/**"
      - "dsp/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    name: release firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tag matches vcv/plugin.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(jq -r .version vcv/plugin.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match vcv/plugin.json version ($want)"
            exit 1
          fi
      - uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1.14.1
        with:
          release: 13.3.Rel1
      - name: Build the firmware
        run: make firmware -j"$(nproc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firmware
          path: hw/build/deaths-hand.bin
          retention-days: 7

  vcv-linux:
    name: release vcv (lin-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          scripts/fetch-rack-sdk.sh "$RUNNER_TEMP/Rack-SDK" lin-x64
          make -C vcv RACK_DIR="$RUNNER_TEMP/Rack-SDK" -j"$(nproc)" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vcv-lin-x64
          path: vcv/dist/*.vcvplugin
          retention-days: 7

  # Native MinGW-w64 build in MSYS2, the toolchain VCV documents for Windows.
  vcv-windows:
    name: release vcv (win-x64)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            curl
            make
            unzip
            zstd
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-jq
      - name: Build
        run: |
          scripts/fetch-rack-sdk.sh "$PWD/../Rack-SDK" win-x64
          make -C vcv RACK_DIR="$PWD/../Rack-SDK" -j"$(nproc)" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vcv-win-x64
          path: vcv/dist/*.vcvplugin
          retention-days: 7

  # Apple's toolchain on an Apple silicon runner: arm64 natively, x64 cross-compiled
  # with clang --target (the SDK's CROSS_COMPILE hook) against the x64 SDK.
  vcv-mac:
    name: release vcv (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            cross: ""
          - platform: mac-x64
            cross: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: command -v zstd >/dev/null || brew install zstd
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          CROSS: ${{ matrix.cross }}
        run: |
          scripts/fetch-rack-sdk.sh "$RUNNER_TEMP/Rack-SDK" "$PLATFORM"
          make -C vcv RACK_DIR="$RUNNER_TEMP/Rack-SDK" ${CROSS:+CROSS_COMPILE="$CROSS"} -j"$(sysctl -n hw.ncpu)" dist
          case "$PLATFORM" in
            mac-arm64) want=arm64 ;;
            mac-x64) want=x86_64 ;;
          esac
          lipo -archs vcv/dist/DeathsHand/plugin.dylib | grep -qx "$want"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vcv-${{ matrix.platform }}
          path: vcv/dist/*.vcvplugin
          retention-days: 7

  publish:
    name: sign and publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [firmware, vcv-linux, vcv-windows, vcv-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          test -f deaths-hand.bin
          test "$(ls ./*.vcvplugin | wc -l)" -eq 4
          sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every asset
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/deaths-hand.bin
            dist/*.vcvplugin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Death's Hand $TAG" --generate-notes --verify-tag
