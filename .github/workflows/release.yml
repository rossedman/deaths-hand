name: release

# On a v* tag: build the patch.Init firmware and the VCV Rack plugin (Linux x64), sign every
# asset keylessly with cosign, attest build provenance, and publish a GitHub release.
# The tag must match the version in vcv/plugin.json (VCV requires it to start with 2.).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tag matches vcv/plugin.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(jq -r .version vcv/plugin.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match vcv/plugin.json version ($want)"
            exit 1
          fi
      - uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1.14.1
        with:
          release: 13.3.Rel1
      - name: Build the firmware
        run: make firmware -j"$(nproc)"
      - name: Build the VCV plugin
        run: |
          scripts/fetch-rack-sdk.sh "$RUNNER_TEMP/Rack-SDK"
          make vcv RACK_DIR="$RUNNER_TEMP/Rack-SDK" -j"$(nproc)"
      - name: Collect assets
        run: |
          mkdir -p dist
          cp hw/build/deaths-hand.bin dist/
          cp vcv/dist/*.vcvplugin dist/
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every asset
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/deaths-hand.bin
            dist/*.vcvplugin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Death's Hand $TAG" --generate-notes --verify-tag
