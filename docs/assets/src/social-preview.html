<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>

  .sub { margin-top: 16px; font-size: 21px; color: var(--mist); }
  .sub b { color: var(--cream); font-weight: 600; }

<body>
  <div class="sigil"></div>
  <div class="runes l"></div><div class="runes r"></div>

    <img class="logo" src="../site/logo.svg" alt="">
